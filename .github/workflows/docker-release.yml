name: Docker Release

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push image to GHCR
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - target: management-ui
            name: opencode-remote-management-ui
          - target: opencode
            name: opencode-remote-opencode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'workflow_dispatch' || inputs.push_image == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/jingjie1135/omo-frp/${{ matrix.image.name }}
          tags: |
            type=edge,branch=$repo.default_branch
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and optionally push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          target: ${{ matrix.image.target }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image output
        run: |
          {
            echo "## Docker image"
            echo ""
            echo "Image: ${{ env.REGISTRY }}/jingjie1135/omo-frp/${{ matrix.image.name }}"
            echo "Target: ${{ matrix.image.target }}"
            echo "Digest: ${{ steps.build.outputs.digest }}"
            echo ""
            echo 'Tags:'
            echo '${{ steps.meta.outputs.tags }}'
          } >> "$GITHUB_STEP_SUMMARY"
