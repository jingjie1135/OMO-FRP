[package]
name = "opencode-remote-platform"
version = "0.1.0"
description = "OpenCode remote platform desktop shell"
authors = ["OpenCode Remote Platform"]
edition = "2021"

[lib]
name = "opencode_remote_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
